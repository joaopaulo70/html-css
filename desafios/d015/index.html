<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mail,person,vpn_key"/>
    <link rel="stylesheet" href="estilos/media-queries.css">

</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <!-- Aqui vai a imagem na css -->
            </div>
            <div id="formulario">
                <form action="cadastro.php" method="get" autocomplete="on">
                        <h1>Login</h1>
                        <p>Seja bem-vindo(a). Faça login para acessar sua conta e poder fazer configurações no seu ambiente</p>

                        <div class="campo">
                            <span id="pessoa" class="material-symbols-outlined">
                            person
                            </span>
                            <label for="iemail"></label>
                            <input type="email" name="email" id="iemail" placeholder="seu e-mail" required>
                        </div>

                        <div class="campo">
                            <span id="chave" class="material-symbols-outlined">
                            vpn_key
                            </span>
                            <label for="isenha"></label>
                            <input type="password" name="senha" id="isenha" placeholder="sua senha" required minlength="8">
                        </div>

                        <div id="login">
                            <input type="submit" value="Entrar">
                        </div>


                        <a href="esqueci.html" class="botao">
                            Esqueci a senha 
                        <span class="material-symbols-outlined">
                        mail
                        </span>
                        </a>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
